name: Deploy to Azure Container Apps
description: "Update an Azure Container App with a new image and environment variables. Authentication and image building should be handled separately."
branding:
  icon: "upload-cloud"
  color: "blue"

inputs:
  # Required inputs
  container_app_name:
    description: "Name of the Azure Container App or Container App Job"
    required: true
  resource_group:
    description: "Azure Resource Group containing the Container App"
    required: true
  image:
    description: "Full container image name with tag (e.g., myregistry.azurecr.io/myapp:v1.0.0)"
    required: true

  # Optional inputs
  container_name:
    description: "Name of the container within the Container App (defaults to app name)"
    required: false
    default: ""
  resource_type:
    description: "Type of resource: 'app' for Container App or 'job' for Container App Job"
    required: false
    default: "app"
  env_vars:
    description: "Environment variables in KEY=value format (one per line)"
    required: false
    default: ""
  secrets:
    description: "Secrets in KEY=value format (one per line). Will be set as environment variables."
    required: false
    default: ""
  secrets_json:
    description: "Secrets as JSON object (e.g., using toJSON(secrets)). Will be set as environment variables."
    required: false
    default: ""
  keyvault_secrets:
    description: "Azure Key Vault secret references in KEY=VAULT_URL/secrets/SECRET_NAME format (one per line). Requires managed identity with Key Vault access."
    required: false
    default: ""
  managed_identity:
    description: "Managed identity resource ID to use for Key Vault access (required if using keyvault_secrets). Use 'system' for system-assigned identity."
    required: false
    default: ""
  remove_all_env_vars:
    description: "Remove all existing environment variables before setting new ones"
    required: false
    default: "false"
  cpu:
    description: "CPU cores (e.g., '0.5', '1.0', '2.0')"
    required: false
    default: ""
  memory:
    description: "Memory in Gi (e.g., '1.0Gi', '2.0Gi')"
    required: false
    default: ""
  min_replicas:
    description: "Minimum number of replicas"
    required: false
    default: ""
  max_replicas:
    description: "Maximum number of replicas"
    required: false
    default: ""
  command:
    description: "Command to run for Container App Jobs (e.g., '/app/entrypoint.sh')"
    required: false
    default: ""
  args:
    description: "Arguments for the command (space-separated, e.g., 'python ./manage.py execute_jobrun')"
    required: false
    default: ""
  replica_timeout:
    description: "Timeout for job replicas in seconds (Container App Jobs only)"
    required: false
    default: ""
  replica_retry_limit:
    description: "Retry limit for failed job replicas (Container App Jobs only)"
    required: false
    default: ""
  validation:
    description: "Post-deployment validation: 'none', 'revision', or 'revision-and-http'"
    required: false
    default: "none"
  validation_timeout:
    description: "Maximum validation time in seconds"
    required: false
    default: "300"
  health_check_url:
    description: "HTTP(S) URL to check when validation is 'revision-and-http'"
    required: false
    default: ""
  health_check_status_codes:
    description: "Expected HTTP status code or range, for example '200' or '200-399'"
    required: false
    default: "200-399"

outputs:
  fqdn:
    description: "Fully qualified domain name of the Container App"
    value: ${{ steps.deploy.outputs.fqdn }}
  url:
    description: "Full URL of the Container App (https://fqdn)"
    value: ${{ steps.deploy.outputs.url }}
  revision_name:
    description: "Name of the deployed revision"
    value: ${{ steps.deploy.outputs.revision_name }}
  validation:
    description: "Result of post-deployment validation"
    value: ${{ steps.deploy.outputs.validation }}

runs:
  using: composite
  steps:
    - name: Deploy to Azure Container App
      shell: bash
      id: deploy
      env:
        INPUT_CONTAINER_APP_NAME: ${{ inputs.container_app_name }}
        INPUT_RESOURCE_GROUP: ${{ inputs.resource_group }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_CONTAINER_NAME: ${{ inputs.container_name }}
        INPUT_RESOURCE_TYPE: ${{ inputs.resource_type }}
        INPUT_ENV_VARS: ${{ inputs.env_vars }}
        INPUT_SECRETS: ${{ inputs.secrets }}
        INPUT_SECRETS_JSON: ${{ inputs.secrets_json }}
        INPUT_KEYVAULT_SECRETS: ${{ inputs.keyvault_secrets }}
        INPUT_MANAGED_IDENTITY: ${{ inputs.managed_identity }}
        INPUT_REMOVE_ALL_ENV_VARS: ${{ inputs.remove_all_env_vars }}
        INPUT_CPU: ${{ inputs.cpu }}
        INPUT_MEMORY: ${{ inputs.memory }}
        INPUT_MIN_REPLICAS: ${{ inputs.min_replicas }}
        INPUT_MAX_REPLICAS: ${{ inputs.max_replicas }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_REPLICA_TIMEOUT: ${{ inputs.replica_timeout }}
        INPUT_REPLICA_RETRY_LIMIT: ${{ inputs.replica_retry_limit }}
        INPUT_VALIDATION: ${{ inputs.validation }}
        INPUT_VALIDATION_TIMEOUT: ${{ inputs.validation_timeout }}
        INPUT_HEALTH_CHECK_URL: ${{ inputs.health_check_url }}
        INPUT_HEALTH_CHECK_STATUS_CODES: ${{ inputs.health_check_status_codes }}
      run: |
        set -euo pipefail

        # Keep values as single argv elements. In particular, do not construct a
        # shell command string: secrets may contain shell metacharacters and must
        # never be reparsed by eval.
        env_var_args=()
        keyvault_secret_args=()

        trim_key() {
          local value="$1"
          value="${value#${value%%[![:space:]]*}}"
          value="${value%${value##*[![:space:]]}}"
          printf '%s' "$value"
        }

        append_env_lines() {
          local content="$1"
          local line key value
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" ]] && continue
            line="${line%$'\r'}"
            key="${line%%=*}"
            if [[ "$line" == *=* ]]; then
              value="${line#*=}"
            else
              value=""
            fi
            key="$(trim_key "$key")"
            [[ -n "$key" ]] && env_var_args+=("$key=$value")
          done < <(printf '%s\n' "$content")
        }

        append_env_lines "$INPUT_ENV_VARS"
        append_env_lines "$INPUT_SECRETS"

        if [[ -n "$INPUT_SECRETS_JSON" ]]; then
          if ! jq -e 'type == "object"' >/dev/null <<<"$INPUT_SECRETS_JSON"; then
            echo "::error::secrets_json must be a JSON object."
            exit 1
          fi

          while IFS= read -r encoded_entry; do
            entry="$(printf '%s' "$encoded_entry" | base64 --decode)"
            key="$(jq -r '.key' <<<"$entry")"
            value="$(jq -r '.value // ""' <<<"$entry")"
            [[ -n "$key" ]] && env_var_args+=("$key=$value")
          done < <(jq -r 'to_entries[] | @base64' <<<"$INPUT_SECRETS_JSON")
        fi

        if [[ -n "$INPUT_KEYVAULT_SECRETS" ]]; then
          if [[ -z "$INPUT_MANAGED_IDENTITY" ]]; then
            echo "::error::managed_identity is required when using keyvault_secrets."
            exit 1
          fi

          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" ]] && continue
            line="${line%$'\r'}"
            key="${line%%=*}"
            if [[ "$line" == *=* ]]; then
              vault_secret_url="${line#*=}"
            else
              vault_secret_url=""
            fi
            key="$(trim_key "$key")"
            if [[ -n "$key" && -n "$vault_secret_url" ]]; then
              keyvault_secret_args+=("$key=keyvaultref:$vault_secret_url,identityref:$INPUT_MANAGED_IDENTITY")
            fi
          done < <(printf '%s\n' "$INPUT_KEYVAULT_SECRETS")
        fi

        case "$INPUT_VALIDATION" in
          none|revision|revision-and-http)
            ;;
          *)
            echo "::error::validation must be one of: none, revision, revision-and-http."
            exit 1
            ;;
        esac

        if ! [[ "$INPUT_VALIDATION_TIMEOUT" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::validation_timeout must be a positive number of seconds."
          exit 1
        fi

        if [[ "$INPUT_RESOURCE_TYPE" == "job" && "$INPUT_VALIDATION" != "none" ]]; then
          echo "::error::revision validation is supported only for Container Apps, not Container App Jobs."
          exit 1
        fi

        if [[ "$INPUT_VALIDATION" == "revision-and-http" ]]; then
          if [[ ! "$INPUT_HEALTH_CHECK_URL" =~ ^https?://[^[:space:]]+$ ]]; then
            echo "::error::health_check_url must be an absolute HTTP(S) URL when validation is revision-and-http."
            exit 1
          fi

          if [[ ! "$INPUT_HEALTH_CHECK_STATUS_CODES" =~ ^[0-9]{3}(-[0-9]{3})?$ ]]; then
            echo "::error::health_check_status_codes must be a three-digit code or range such as 200-399."
            exit 1
          fi

          status_min="${INPUT_HEALTH_CHECK_STATUS_CODES%%-*}"
          status_max="${INPUT_HEALTH_CHECK_STATUS_CODES##*-}"
          [[ "$status_min" == "$INPUT_HEALTH_CHECK_STATUS_CODES" ]] && status_max="$status_min"
          if ((10#$status_min > 10#$status_max)); then
            echo "::error::health_check_status_codes must specify an ascending range."
            exit 1
          fi

          if ! command -v curl >/dev/null 2>&1; then
            echo "::error::curl is required for HTTP health validation."
            exit 1
          fi
        fi

        if [[ "$INPUT_RESOURCE_TYPE" == "job" ]]; then
          command=(az containerapp job update)
        else
          command=(az containerapp update)
        fi

        if ((${#keyvault_secret_args[@]} > 0)); then
          if [[ "$INPUT_RESOURCE_TYPE" == "job" ]]; then
            secret_command=(az containerapp job secret set)
          else
            secret_command=(az containerapp secret set)
          fi
          secret_command+=(
            --name "$INPUT_CONTAINER_APP_NAME"
            --resource-group "$INPUT_RESOURCE_GROUP"
            --secrets "${keyvault_secret_args[@]}"
            --output none
          )

          echo "Setting Key Vault secret references for $INPUT_RESOURCE_TYPE '$INPUT_CONTAINER_APP_NAME' without logging secret values."
          "${secret_command[@]}"
        fi

        command+=(
          --name "$INPUT_CONTAINER_APP_NAME"
          --resource-group "$INPUT_RESOURCE_GROUP"
          --image "$INPUT_IMAGE"
        )

        if [[ "$INPUT_RESOURCE_TYPE" != "job" ]]; then
          container_name="$INPUT_CONTAINER_NAME"
          [[ -z "$container_name" ]] && container_name="$INPUT_CONTAINER_APP_NAME"
          command+=(--container-name "$container_name")

          [[ -n "$INPUT_CPU" ]] && command+=(--cpu "$INPUT_CPU")
          [[ -n "$INPUT_MEMORY" ]] && command+=(--memory "$INPUT_MEMORY")
          [[ -n "$INPUT_MIN_REPLICAS" ]] && command+=(--min-replicas "$INPUT_MIN_REPLICAS")
          [[ -n "$INPUT_MAX_REPLICAS" ]] && command+=(--max-replicas "$INPUT_MAX_REPLICAS")
        else
          [[ -n "$INPUT_COMMAND" ]] && command+=(--command "$INPUT_COMMAND")
          if [[ -n "$INPUT_ARGS" ]]; then
            read -r -a job_args <<<"$INPUT_ARGS"
            command+=(--args "${job_args[@]}")
          fi
          [[ -n "$INPUT_REPLICA_TIMEOUT" ]] && command+=(--replica-timeout "$INPUT_REPLICA_TIMEOUT")
          [[ -n "$INPUT_REPLICA_RETRY_LIMIT" ]] && command+=(--replica-retry-limit "$INPUT_REPLICA_RETRY_LIMIT")
        fi

        if [[ "$INPUT_REMOVE_ALL_ENV_VARS" == "true" ]]; then
          command+=(--replace-env-vars)
          ((${#env_var_args[@]} > 0)) && command+=("${env_var_args[@]}")
        elif ((${#env_var_args[@]} > 0)); then
          command+=(--set-env-vars "${env_var_args[@]}")
        fi

        echo "Deploying $INPUT_RESOURCE_TYPE '$INPUT_CONTAINER_APP_NAME' without logging secret values."
        output="$("${command[@]}")"

        if [[ "$INPUT_RESOURCE_TYPE" == "app" ]]; then
          fqdn="$(jq -r '.properties.configuration.ingress.fqdn // empty' <<<"$output")"
          revision_name="$(jq -r '.properties.latestRevisionName // empty' <<<"$output")"
          if [[ -z "$revision_name" ]]; then
            revision_name="$(az containerapp show \
              --name "$INPUT_CONTAINER_APP_NAME" \
              --resource-group "$INPUT_RESOURCE_GROUP" \
              --query 'properties.latestRevisionName' \
              --output tsv)"
          fi

          if [[ -n "$fqdn" ]]; then
            echo "fqdn=$fqdn" >>"$GITHUB_OUTPUT"
            echo "url=https://$fqdn" >>"$GITHUB_OUTPUT"
            echo "  ✓ Deployed successfully"
            echo "  🌐 URL: https://$fqdn"
          else
            echo "  ✓ Deployed successfully (no ingress configured)"
          fi

          if [[ -n "$revision_name" ]]; then
            echo "revision_name=$revision_name" >>"$GITHUB_OUTPUT"
          fi

          if [[ "$INPUT_VALIDATION" != "none" ]]; then
            if [[ -z "$revision_name" ]]; then
              echo "::error::Azure did not return a latest revision name for the deployed app."
              exit 1
            fi

            deadline=$((SECONDS + INPUT_VALIDATION_TIMEOUT))
            expected_status_min="${INPUT_HEALTH_CHECK_STATUS_CODES%%-*}"
            expected_status_max="${INPUT_HEALTH_CHECK_STATUS_CODES##*-}"
            [[ "$expected_status_min" == "$INPUT_HEALTH_CHECK_STATUS_CODES" ]] && expected_status_max="$expected_status_min"
            validation_complete=false

            echo "Validating revision '$revision_name'."
            while ((SECONDS < deadline)); do
              revision_output=""
              if revision_output="$(az containerapp revision show \
                --name "$INPUT_CONTAINER_APP_NAME" \
                --resource-group "$INPUT_RESOURCE_GROUP" \
                --revision "$revision_name" \
                --output json 2>/dev/null)"; then
                provisioning_state="$(jq -r '.properties.provisioningState // empty' <<<"$revision_output")"
                running_state="$(jq -r '.properties.runningState // empty' <<<"$revision_output")"
                health_state="$(jq -r '.properties.healthState // empty' <<<"$revision_output")"
                revision_image="$(jq -r --arg container_name "$container_name" '([.properties.template.containers[]? | select(.name == $container_name) | .image] + [.properties.template.containers[]? | .image])[0] // empty' <<<"$revision_output")"

                if [[ "$provisioning_state" == "Failed" || "$running_state" == "Failed" || "$running_state" == "Degraded" || "$health_state" == "Unhealthy" ]]; then
                  echo "::error::Revision '$revision_name' failed validation (provisioning=$provisioning_state, running=$running_state, health=$health_state)."
                  exit 1
                fi

                if [[ "$revision_image" != "$INPUT_IMAGE" ]]; then
                  echo "::error::Revision '$revision_name' is using an unexpected image."
                  echo "::error::Expected image: $INPUT_IMAGE"
                  echo "::error::Actual image: $revision_image"
                  exit 1
                fi

                latest_ready_revision="$(az containerapp show \
                  --name "$INPUT_CONTAINER_APP_NAME" \
                  --resource-group "$INPUT_RESOURCE_GROUP" \
                  --query 'properties.latestReadyRevisionName' \
                  --output tsv 2>/dev/null || true)"

                if [[ "$provisioning_state" == "Provisioned" && "$running_state" == "Running" && "$health_state" == "Healthy" && "$latest_ready_revision" == "$revision_name" ]]; then
                  validation_complete=true
                  break
                fi
              fi
              sleep 5
            done

            if [[ "$validation_complete" != "true" ]]; then
              echo "::error::Revision '$revision_name' did not become ready within ${INPUT_VALIDATION_TIMEOUT}s."
              exit 1
            fi
            echo "  ✓ Revision is provisioned, running, healthy, and ready"

            if [[ "$INPUT_VALIDATION" == "revision-and-http" ]]; then
              deadline=$((SECONDS + INPUT_VALIDATION_TIMEOUT))
              http_check_complete=false
              echo "Checking application health endpoint without logging its response body."
              while ((SECONDS < deadline)); do
                http_status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 15 "$INPUT_HEALTH_CHECK_URL" 2>/dev/null || true)"
                if [[ "$http_status" =~ ^[0-9]{3}$ ]] && ((10#$http_status >= 10#$expected_status_min && 10#$http_status <= 10#$expected_status_max)); then
                  http_check_complete=true
                  break
                fi
                sleep 5
              done

              if [[ "$http_check_complete" != "true" ]]; then
                echo "::error::Health check did not return an expected status (${INPUT_HEALTH_CHECK_STATUS_CODES}) within ${INPUT_VALIDATION_TIMEOUT}s."
                exit 1
              fi
              echo "  ✓ Application health endpoint returned HTTP $http_status"
            fi
          fi
          echo "validation=$INPUT_VALIDATION" >>"$GITHUB_OUTPUT"
        else
          echo "  ✓ Container App Job updated successfully"
          echo "validation=none" >>"$GITHUB_OUTPUT"
        fi

    - name: Add deployment summary
      shell: bash
      run: |
        echo "## 🚀 Deployment Complete" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
        echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
        echo "| **Resource Type** | ${{ inputs.resource_type }} |" >> "$GITHUB_STEP_SUMMARY"
        echo "| **Container App** | \`${{ inputs.container_app_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| **Resource Group** | \`${{ inputs.resource_group }}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| **Image** | \`${{ inputs.image }}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| **Container Name** | \`${{ inputs.container_name || inputs.container_app_name }}\` |" >> "$GITHUB_STEP_SUMMARY"

        if [ -n "${{ steps.deploy.outputs.url }}" ]; then
          echo "| **URL** | ${{ steps.deploy.outputs.url }} |" >> "$GITHUB_STEP_SUMMARY"
        fi

        echo "" >> "$GITHUB_STEP_SUMMARY"
